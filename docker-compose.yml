# ==========================================================================
# API Proxy – Basic Deployment
#
# Spins up: init (seed DB) -> proxy -> admin
# Pre-seeds: providers (Google, Miro, Asana), app, credentials,
#            registry rules, firewall rules, alert configs, mock captures
#
# Usage:
#   cp .env.example .env
#   docker compose up --build
#   Open http://localhost:3000, log in, configure credentials for
#   Google (OAuth client_id + secret), Miro, and Asana.
# ==========================================================================

services:
  # --- 1. Init: generate keys + seed database ---
  init:
    build:
      context: ./deploy/init
      dockerfile: Dockerfile
    volumes:
      - shared-data:/app/data
    environment:
      - DATA_DIR=/app/data

  # --- 2. Proxy: Rust MITM proxy + management API ---
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    ports:
      - "${PROXY_PORT:-8888}:8888"
      - "${MGMT_PORT:-8889}:8889"
    volumes:
      - shared-data:/app/data
    environment:
      - DATABASE_PATH=/app/data/proxy.db
      - MASTER_KEY_PATH=/app/data/master.key
      - CA_CERT_PATH=/app/data/ca_cert.pem
      - CA_KEY_PATH=/app/data/ca_key.pem
      - PROXY_PORT=8888
      - MGMT_PORT=8889
      - RUST_LOG=${RUST_LOG:-info}
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8889/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # --- 3. Admin: Next.js dashboard ---
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    volumes:
      - shared-data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/proxy.db
      - MASTER_KEY_PATH=/app/data/master.key
      - PROXY_MANAGEMENT_URL=http://proxy:8889
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - SESSION_SECRET=${SESSION_SECRET:-super-secret-session-key-change-in-prod}
      - NODE_ENV=production
    depends_on:
      proxy:
        condition: service_healthy

volumes:
  shared-data:
